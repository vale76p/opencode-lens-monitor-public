name: swift

# Test Swift e build dell'app su macOS, senza firma: nessun certificato né segreto nella CI.
# Le release firmate le crea chi rilascia, sul suo Mac (scripts/package.sh --upload).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    # Due versioni di Xcode: 26 (Swift 6.3), il minimo per chi compila dal «Source code» su macOS 26,
    # e 27 (Swift 6.4), come le release. xcode-27 è un'immagine in anteprima di GitHub (macOS 27):
    # quando arriva macos-27, passare a quella.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strumenti
        run: xcodebuild -version && xcrun --show-sdk-version && swift --version
      # i test lanciano anche install.sh e package.sh in una HOME temporanea
      - name: Test (scripts/test.sh)
        run: scripts/test.sh
      # la stessa build di install.sh dal «Source code»: senza certificato firma ad-hoc
      - name: Build con i Command Line Tools (scripts/build-clt.sh)
        run: |
          mkdir -p "$RUNNER_TEMP/clt"
          bash scripts/build-clt.sh "$RUNNER_TEMP/clt"
          codesign --verify --deep --strict "$RUNNER_TEMP/clt/OpenCode Lens Monitor.app"
      # la build di Xcode delle release (scripts/package.sh), qui senza firma
      - name: Build con Xcode (XcodeGen + xcodebuild, senza firma)
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project OpenCodeLensMonitor.xcodeproj -scheme OpenCodeLensMonitor -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
